<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMÓVEIS • PRO | Gestão Imobiliária</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a237e;<br/>
            --secondary: #27ae60;<br/>
            --danger: #e74c3c;<br/>
            --warning: #f39c12;<br/>
            --light: #f4f7f6;<br/>
            --dark: #2c3e50;<br/>
            --white: #ffffff;<br/>
            --gray: #95a5a6;<br/>
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }<br/>
        body { background-color: var(--light); color: var(--dark); overflow-x: hidden; }

        /* Login Screen */
        #login-screen {
            height: 100vh;<br/>
            display: flex;<br/>
            align-items: center;<br/>
            justify-content: center;<br/>
            background: linear-gradient(135deg, var(--primary) 0%, #3949ab 100%);
        }
        .login-card {
            background: var(--white);<br/>
            padding: 2.5rem;<br/>
            border-radius: 12px;<br/>
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);<br/>
            width: 100%;<br/>
            max-width: 400px;<br/>
            text-align: center;
        }
        .login-card h1 { color: var(--primary); margin-bottom: 1.5rem; font-weight: 700; letter-spacing: -1px; }
        .login-card input {
            width: 100%;<br/>
            padding: 12px;<br/>
            margin-bottom: 1rem;<br/>
            border: 1px solid #ddd;<br/>
            border-radius: 6px;<br/>
            outline: none;
        }
        .login-card button {
            width: 100%;<br/>
            padding: 12px;<br/>
            background: var(--secondary);<br/>
            color: white;<br/>
            border: none;<br/>
            border-radius: 6px;<br/>
            font-weight: bold;<br/>
            cursor: pointer;<br/>
            transition: 0.3s;
        }
        .login-card button:hover { background: #219150; }<br/>
        #login-error { color: var(--danger); font-size: 0.9rem; margin-bottom: 1rem; display: none; }

        /* Dashboard Layout */
        #main-dashboard { display: none; }
        header {
            background: var(--white);<br/>
            padding: 1rem 5%;<br/>
            display: flex;<br/>
            justify-content: space-between;<br/>
            align-items: center;<br/>
            box-shadow: var(--shadow);<br/>
            position: fixed;<br/>
            top: 0;<br/>
            width: 100%;<br/>
            z-index: 100;
        }
        .logo { color: var(--primary); font-weight: 900; font-size: 1.5rem; }<br/>
        .header-info { display: flex; gap: 20px; align-items: center; font-size: 0.85rem; color: var(--gray); }<br/>
        .btn-nav { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; }<br/>
        .btn-new { background: var(--secondary); color: white; }<br/>
        .btn-csv { background: #ecf0f1; color: var(--dark); }<br/>
        .btn-exit { background: transparent; color: var(--danger); }

        main { padding: 100px 5% 50px; max-width: 1400px; margin: 0 auto; }

        /* Controls */
        .controls-row {
            display: flex;<br/>
            flex-wrap: wrap;<br/>
            justify-content: space-between;<br/>
            align-items: center;<br/>
            margin-bottom: 2rem;<br/>
            gap: 20px;
        }
        .search-box {
            flex: 1;<br/>
            min-width: 300px;<br/>
            position: relative;
        }
        .search-box input {
            width: 100%;<br/>
            padding: 12px 40px;<br/>
            border-radius: 8px;<br/>
            border: 1px solid #ddd;<br/>
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .search-box i { position: absolute; left: 15px; top: 15px; color: var(--gray); }

        .filter-tabs { display: flex; background: #ddd; padding: 4px; border-radius: 8px; }
        .filter-tabs button {
            padding: 8px 20px;<br/>
            border: none;<br/>
            background: transparent;<br/>
            cursor: pointer;<br/>
            border-radius: 6px;<br/>
            font-weight: 500;
        }
        .filter-tabs button.active { background: var(--white); color: var(--primary); box-shadow: var(--shadow); }

        .cloud-link { display: block; margin-top: 10px; color: var(--primary); text-decoration: none; font-size: 0.9rem; }<br/>
        .stats-bar { margin-bottom: 1rem; font-weight: 500; color: var(--dark); }

        /* Property Cards */
        .property-grid {
            display: grid;<br/>
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));<br/>
            gap: 25px;
        }
        .card {
            background: var(--white);<br/>
            border-radius: 12px;<br/>
            overflow: hidden;<br/>
            box-shadow: var(--shadow);<br/>
            transition: transform 0.3s;<br/>
            border: 1px solid #eee;
        }
        .card:hover { transform: translateY(-5px); }
        .card-header {
            padding: 15px;<br/>
            background: #f8f9fa;<br/>
            border-bottom: 1px solid #eee;<br/>
            display: flex;<br/>
            justify-content: space-between;<br/>
            align-items: center;
        }
        .client-code {
            background: var(--primary);<br/>
            color: white;<br/>
            padding: 4px 8px;<br/>
            border-radius: 4px;<br/>
            font-size: 0.75rem;<br/>
            font-weight: bold;
        }
        .property-type { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--gray); }<br/>
        .card-body { padding: 20px; }<br/>
        .card-address { font-weight: 700; margin-bottom: 5px; font-size: 1.1rem; }<br/>
        .card-sub { color: var(--gray); font-size: 0.9rem; margin-bottom: 15px; }<br/>
        .card-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }<br/>
        .info-item { font-size: 0.85rem; }<br/>
        .info-label { color: var(--gray); display: block; font-size: 0.7rem; text-transform: uppercase; }
        .status-badge {
            display: inline-block;<br/>
            padding: 4px 10px;<br/>
            border-radius: 20px;<br/>
            font-size: 0.75rem;<br/>
            font-weight: bold;
        }
        .status-disponivel { background: #e8f5e9; color: #2e7d32; }<br/>
        .status-alugado { background: #e3f2fd; color: #1565c0; }
        .card-footer {
            padding: 15px;<br/>
            border-top: 1px solid #eee;<br/>
            display: flex;<br/>
            justify-content: space-between;
        }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1rem; padding: 5px; transition: 0.2s; }<br/>
        .btn-view { color: var(--primary); }<br/>
        .btn-edit { color: var(--warning); }<br/>
        .btn-delete { color: var(--danger); }

        /* Modals */
        .modal-overlay {
            position: fixed;<br/>
            top: 0; left: 0; width: 100%; height: 100%;<br/>
            background: rgba(0,0,0,0.7);<br/>
            display: none;<br/>
            justify-content: center;<br/>
            align-items: center;<br/>
            z-index: 1000;<br/>
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--white);<br/>
            width: 90%;<br/>
            max-width: 900px;<br/>
            max-height: 90vh;<br/>
            border-radius: 12px;<br/>
            overflow-y: auto;<br/>
            position: relative;
        }
        .modal-header {
            padding: 20px;<br/>
            background: var(--dark);<br/>
            color: white;<br/>
            display: flex;<br/>
            justify-content: space-between;<br/>
            align-items: center;<br/>
            position: sticky;<br/>
            top: 0;<br/>
            z-index: 10;
        }
        .modal-body { padding: 30px; }
        .form-grid {
            display: grid;<br/>
            grid-template-columns: repeat(3, 1fr);<br/>
            gap: 20px;
        }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }<br/>
        .form-group { display: flex; flex-direction: column; gap: 5px; }<br/>
        .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--gray); text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;<br/>
            border: 1px solid #ddd;<br/>
            border-radius: 6px;<br/>
            outline: none;
        }
        .full-width { grid-column: 1 / -1; }<br/>
        .cep-row { display: flex; gap: 10px; }<br/>
        .btn-cep { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; }
        
        .file-section {
            margin-top: 20px;<br/>
            padding-top: 20px;<br/>
            border-top: 1px solid #eee;
        }
        .file-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .btn-file {
            background: #f8f9fa;<br/>
            border: 1px dashed #ccc;<br/>
            padding: 10px 15px;<br/>
            border-radius: 6px;<br/>
            font-size: 0.8rem;<br/>
            cursor: pointer;<br/>
            transition: 0.2s;
        }
        .btn-file:hover { background: #e9ecef; border-color: var(--primary); }

        .modal-footer {
            padding: 20px;<br/>
            border-top: 1px solid #eee;<br/>
            display: flex;<br/>
            justify-content: flex-end;<br/>
            gap: 15px;<br/>
            position: sticky;<br/>
            bottom: 0;<br/>
            background: white;
        }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; }<br/>
        .btn-save { background: var(--secondary); color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Details View */
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }<br/>
        .detail-item { border-bottom: 1px solid #f0f0f0; padding: 8px 0; }<br/>
        .detail-label { font-weight: bold; color: var(--gray); font-size: 0.75rem; text-transform: uppercase; display: block; }<br/>
        .detail-value { font-size: 1rem; color: var(--dark); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <section id="login-screen">
        <div class="login-card">
            <h1>IMÓVEIS • PRO</h1>
            <div id="login-error">Usuário ou senha incorretos!</div>
            <input type="text" id="user" placeholder="Usuário (admin)">
            <input type="password" id="pass" placeholder="Senha (imob2026)">
            <button onclick="entrar()">ACESSAR SISTEMA</button>
            <p style="margin-top: 15px; font-size: 0.7rem; color: #999;">v1.0.4 - Cloud Sync Active</p>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section id="main-dashboard">
        <header>
            <div class="logo"><i class="fas fa-building"></i> IMÓVEIS • PRO</div>
            <div class="header-info">
                <span>☁️ Cloud OK</span>
                <span>💾 0 KB</span>
                <button class="btn-nav btn-csv" onclick="exportarCSV()"><i class="fas fa-download"></i> CSV</button>
                <button class="btn-nav btn-new" onclick="abrirModalNovo()"><i class="fas fa-plus"></i> NOVO</button>
                <button class="btn-nav btn-exit" onclick="sair()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main>
            <div class="stats-bar">
                <span id="contador-imoveis">0 imóveis</span> cadastrados
            </div>

            <div class="controls-row">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="input-pesquisa" placeholder="Buscar por código do cliente, endereço ou inquilino..." onkeyup="pesquisar()">
                </div>

                <div class="filter-tabs">
                    <button class="tab-btn active" onclick="filtrarTipo('Todos', this)">🏠 Todos</button>
                    <button class="tab-btn" onclick="filtrarTipo('Residencial', this)">🏡 Residencial</button>
                    <button class="tab-btn" onclick="filtrarTipo('Comercial', this)">🏢 Comercial</button>
                </div>
            </div>

            <a href="#" class="cloud-link">📋 Dados salvos na nuvem (Google Sheets) Abrir Planilha →</a>
            <p style="font-size: 0.75rem; color: var(--gray); margin-bottom: 2rem;">📎 Arquivos ficam salvos no navegador</p>

            <div class="property-grid" id="lista-imoveis">
                <!-- Cards renderizados via JS -->
            </div>
        </main>
    </section>

    <!-- MODAL FORMULÁRIO -->
    <div class="modal-overlay" id="modal-imovel">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Novo Imóvel</h3>
                <button onclick="fecharModal()" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-imovel">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Código do Cliente</label>
                            <input type="text" id="f-codigo" placeholder="Ex: CLT-001">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Imóvel</label>
                            <div style="display:flex; gap:15px; padding:10px 0;">
                                <label style="font-weight:normal; text-transform:none;"><input type="radio" name="f-tipo" value="Residencial" checked> Residencial</label>
                                <label style="font-weight:normal; text-transform:none;"><input type="radio" name="f-tipo" value="Comercial"> Comercial</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>CEP</label>
                            <div class="cep-row">
                                <input type="text" id="f-cep" placeholder="00000-000">
                                <button type="button" class="btn-cep" onclick="buscarCEP()">🔍</button>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label>Endereço Completo *</label>
                            <input type="text" id="f-endereco" required>
                        </div>
                        <div class="form-group">
                            <label>Bairro *</label>
                            <input type="text" id="f-bairro" required>
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="f-cidade">
                        </div>
                        <div class="form-group">
                            <label>Estado (UF)</label>
                            <select id="f-estado">
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PR">Paraná</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="RS">Rio Grande do Sul</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="f-status">
                                <option value="Disponível">Disponível</option>
                                <option value="Alugado">Alugado</option>
                                <option value="Em Reforma">Em Reforma</option>
                                <option value="Vendido">Vendido</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Data de Cadastro</label>
                            <input type="date" id="f-data">
                        </div>
                        <div class="form-group">
                            <label>Valor Aluguel (R$)</label>
                            <input type="number" id="f-valor" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Nº Contribuinte</label>
                            <input type="text" id="f-contribuinte">
                        </div>
                        <div class="form-group">
                            <label>Área (m²)</label>
                            <input type="number" id="f-area">
                        </div>
                        <div class="form-group">
                            <label>IPTU (R$)</label>
                            <input type="number" id="f-iptu" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Registro ENEL</label>
                            <input type="text" id="f-enel">
                        </div>
                        <div class="form-group">
                            <label>Registro Sabesp</label>
                            <input type="text" id="f-sabesp">
                        </div>
                        <div class="form-group">
                            <label>Matrícula</label>
                            <input type="text" id="f-matricula">
                        </div>
                        <div class="form-group">
                            <label>AVCB / Bombeiros</label>
                            <input type="text" id="f-avcb">
                        </div>
                        <div class="form-group">
                            <label>Seguros</label>
                            <input type="text" id="f-seguros">
                        </div>
                        <div class="form-group">
                            <label>Inquilino</label>
                            <input type="text" id="f-inquilino">
                        </div>
                        <div class="form-group">
                            <label>Vigência</label>
                            <input type="text" id="f-vigencia" placeholder="Ex: 12 meses">
                        </div>
                        <div class="form-group">
                            <label>Possui Caução?</label>
                            <div style="display:flex; gap:15px; padding:10px 0;">
                                <label style="font-weight:normal; text-transform:none;"><input type="radio" name="f-caucao" value="Sim"> Sim</label>
                                <label style="font-weight:normal; text-transform:none;"><input type="radio" name="f-caucao" value="Não" checked> Não</label>
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label>Plantas / Observações</label>
                            <textarea id="f-obs" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="file-section">
                        <label style="font-size: 0.8rem; font-weight: 700; color: var(--gray);">ANEXOS</label>
                        <div class="file-buttons">
                            <button type="button" class="btn-file">📐 + Planta</button>
                            <button type="button" class="btn-file">🔑 + Matrícula</button>
                            <button type="button" class="btn-file">📜 + Certidão</button>
                            <button type="button" class="btn-file">📷 + Foto</button>
                            <button type="button" class="btn-file">📄 + Outro</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarImovel()">💾 Salvar Imóvel</button>
            </div>
        </div>
    </div>

    <!-- MODAL VISUALIZAÇÃO -->
    <div class="modal-overlay" id="modal-detalhes">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalhes do Imóvel</h3>
                <button onclick="document.getElementById('modal-detalhes').style.display='none'" style="background:none; border:none; color:white; cursor:pointer; font-size:1.5rem;">&times;</button>
            </div>
            <div class="modal-body" id="detalhes-content">
                <!-- Preenchido via JS -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="document.getElementById('modal-detalhes').style.display='none'">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // ESTADO DA APLICAÇÃO
        let imoveis = [];
        let currentId = null;
        let filtroTipoAtual = 'Todos';
        let termoPesquisa = '';

        // INICIALIZAÇÃO
        window.onload = function() {
            carregarDados();
            document.getElementById('f-data').valueAsDate = new Date();
        };

        // LOGIN
        function entrar() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'imob2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                renderizarImoveis();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function sair() {
            location.reload();
        }

        // PERSISTÊNCIA (Simulando Google Sheets com LocalStorage)
        function salvarDados() {
            localStorage.setItem('imoveis_pro_db', JSON.stringify(imoveis));
            atualizarMeta();
        }

        function carregarDados() {
            const data = localStorage.getItem('imoveis_pro_db');
            if(data) {
                imoveis = JSON.parse(data);
            } else {
                // Dados de Exemplo
                imoveis = [
                    { id: 1, codigo: 'CLT-001', tipo: 'Residencial', endereco: 'Rua A, 100', bairro: 'Centro', cidade: 'São Paulo', estado: 'SP', valor: 1500, inquilino: 'João Silva', status: 'Alugado', data: '2026-07-01', area: 50, caucao: 'Sim' },<br/>
                    { id: 2, codigo: 'CLT-002', tipo: 'Comercial', endereco: 'Av B, 200', bairro: 'Comercial', cidade: 'São Paulo', estado: 'SP', valor: 3200, inquilino: 'Maria Santos', status: 'Disponível', data: '2026-07-15', area: 120, caucao: 'Não' },<br/>
                    { id: 3, codigo: 'CLT-003', tipo: 'Residencial', endereco: 'Rua C, 50', bairro: 'Jardim', cidade: 'Rio de Janeiro', estado: 'RJ', valor: 2100, inquilino: 'Pedro Oliveira', status: 'Alugado', data: '2026-07-20', area: 75, caucao: 'Sim' }
                ];
                salvarDados();
            }
            atualizarMeta();
        }

        function atualizarMeta() {
            const size = new Blob([JSON.stringify(imoveis)]).size;
            document.querySelector('.header-info span:nth-child(2)').innerText = `💾 ${(size/1024).toFixed(2)} KB`;
        }

        // RENDERIZAÇÃO
        function renderizarImoveis() {
            const container = document.getElementById('lista-imoveis');
            container.innerHTML = '';

            const filtrados = imoveis.filter(imovel => {
                const matchTipo = filtroTipoAtual === 'Todos' || imovel.tipo === filtroTipoAtual;
                const search = termoPesquisa.toLowerCase();
                const matchSearch = termoPesquisa.length < 2 || 
                                   (imovel.codigo && imovel.codigo.toLowerCase().includes(search)) ||
                                   (imovel.endereco && imovel.endereco.toLowerCase().includes(search)) ||
                                   (imovel.inquilino && imovel.inquilino.toLowerCase().includes(search));
                return matchTipo && matchSearch;
            });

            document.getElementById('contador-imoveis').innerText = `${filtrados.length} imóveis`;

            filtrados.forEach(imovel => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="property-type">${imovel.tipo === 'Residencial' ? '🏡' : '🏢'} ${imovel.tipo}</span>
                        <span class="client-code">${imovel.codigo || 'S/C'}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-address">${imovel.endereco}</div>
                        <div class="card-sub">${imovel.bairro}, ${imovel.cidade}/${imovel.estado}</div>
                        <div class="card-info">
                            <div class="info-item">
                                <span class="info-label">Aluguel</span>
                                <strong>R$ ${parseFloat(imovel.valor || 0).toLocaleString('pt-BR')}</strong>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Inquilino</span>
                                <strong>${imovel.inquilino || 'Vago'}</strong>
                            </div>
                        </div>
                        <span class="status-badge status-${imovel.status.toLowerCase().replace(' ', '-')}">${imovel.status}</span>
                    </div>
                    <div class="card-footer">
                        <button class="btn-action btn-view" onclick="visualizarImovel(${imovel.id})" title="Visualizar"><i class="fas fa-eye"></i></button>
                        <button class="btn-action btn-edit" onclick="editarImovel(${imovel.id})" title="Editar"><i class="fas fa-edit"></i></button>
                        <button class="btn-action btn-delete" onclick="excluirImovel(${imovel.id})" title="Excluir"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // PESQUISA E FILTROS
        function pesquisar() {
            termoPesquisa = document.getElementById('input-pesquisa').value;
            renderizarImoveis();
        }

        function filtrarTipo(tipo, btn) {
            filtroTipoAtual = tipo;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderizarImoveis();
        }

        // MODAL ACTIONS
        function abrirModalNovo() {
            currentId = null;
            document.getElementById('form-imovel').reset();
            document.getElementById('f-data').valueAsDate = new Date();
            document.getElementById('modal-titulo').innerText = 'Novo Imóvel';
            document.getElementById('modal-imovel').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-imovel').style.display = 'none';
        }

        function editarImovel(id) {
            const imovel = imoveis.find(i => i.id === id);
            if(!imovel) return;

            currentId = id;
            document.getElementById('modal-titulo').innerText = 'Editar Imóvel';
            
            document.getElementById('f-codigo').value = imovel.codigo || '';
            document.querySelector(`input[name="f-tipo"][value="${imovel.tipo}"]`).checked = true;
            document.getElementById('f-cep').value = imovel.cep || '';
            document.getElementById('f-endereco').value = imovel.endereco || '';
            document.getElementById('f-bairro').value = imovel.bairro || '';
            document.getElementById('f-cidade').value = imovel.cidade || '';
            document.getElementById('f-estado').value = imovel.estado || 'SP';
            document.getElementById('f-status').value = imovel.status || 'Disponível';
            document.getElementById('f-data').value = imovel.data || '';
            document.getElementById('f-valor').value = imovel.valor || '';
            document.getElementById('f-contribuinte').value = imovel.contribuinte || '';
            document.getElementById('f-area').value = imovel.area || '';
            document.getElementById('f-iptu').value = imovel.iptu || '';
            document.getElementById('f-enel').value = imovel.enel || '';
            document.getElementById('f-sabesp').value = imovel.sabesp || '';
            document.getElementById('f-matricula').value = imovel.matricula || '';
            document.getElementById('f-avcb').value = imovel.avcb || '';
            document.getElementById('f-seguros').value = imovel.seguros || '';
            document.getElementById('f-inquilino').value = imovel.inquilino || '';
            document.getElementById('f-vigencia').value = imovel.vigencia || '';
            document.querySelector(`input[name="f-caucao"][value="${imovel.caucao || 'Não'}"]`).checked = true;
            document.getElementById('f-obs').value = imovel.obs || '';

            document.getElementById('modal-imovel').style.display = 'flex';
        }

        function salvarImovel() {
            const endereco = document.getElementById('f-endereco').value;
            const bairro = document.getElementById('f-bairro').value;

            if(!endereco || !bairro) {
                alert('Endereço e Bairro são obrigatórios!');
                return;
            }

            const dados = {
                id: currentId || Date.now(),<br/>
                codigo: document.getElementById('f-codigo').value,<br/>
                tipo: document.querySelector('input[name="f-tipo"]:checked').value,<br/>
                cep: document.getElementById('f-cep').value,<br/>
                endereco: endereco,<br/>
                bairro: bairro,<br/>
                cidade: document.getElementById('f-cidade').value,<br/>
                estado: document.getElementById('f-estado').value,<br/>
                status: document.getElementById('f-status').value,<br/>
                data: document.getElementById('f-data').value,<br/>
                valor: document.getElementById('f-valor').value,<br/>
                contribuinte: document.getElementById('f-contribuinte').value,<br/>
                area: document.getElementById('f-area').value,<br/>
                iptu: document.getElementById('f-iptu').value,<br/>
                enel: document.getElementById('f-enel').value,<br/>
                sabesp: document.getElementById('f-sabesp').value,<br/>
                matricula: document.getElementById('f-matricula').value,<br/>
                avcb: document.getElementById('f-avcb').value,<br/>
                seguros: document.getElementById('f-seguros').value,<br/>
                inquilino: document.getElementById('f-inquilino').value,<br/>
                vigencia: document.getElementById('f-vigencia').value,<br/>
                caucao: document.querySelector('input[name="f-caucao"]:checked').value,<br/>
                obs: document.getElementById('f-obs').value
            };

            if(currentId) {
                const index = imoveis.findIndex(i => i.id === currentId);
                imoveis[index] = dados;
            } else {
                imoveis.push(dados);
            }

            salvarDados();
            renderizarImoveis();
            fecharModal();
        }

        function excluirImovel(id) {
            if(confirm('Deseja realmente excluir este imóvel?')) {
                imoveis = imoveis.filter(i => i.id !== id);
                salvarDados();
                renderizarImoveis();
            }
        }

        function visualizarImovel(id) {
            const imovel = imoveis.find(i => i.id === id);
            if(!imovel) return;

            const content = `
                <div class="details-grid">
                    <div class="detail-item"><span class="detail-label">Código do Cliente</span><span class="detail-value">${imovel.codigo || '-'}</span></div>
                    <div class="detail-item"><span class="detail-label">Tipo</span><span class="detail-value">${imovel.tipo}</span></div>
                    <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value">${imovel.status}</span></div>
                    <div class="detail-item"><span class="detail-label">Valor Aluguel</span><span class="detail-value">R$ ${parseFloat(imovel.valor || 0).toLocaleString('pt-BR')}</span></div>
                    <div class="detail-item" style="grid-column: span 2;"><span class="detail-label">Endereço</span><span class="detail-value">${imovel.endereco}, ${imovel.bairro} - ${imovel.cidade}/${imovel.estado}</span></div>
                    <div class="detail-item"><span class="detail-label">Inquilino</span><span class="detail-value">${imovel.inquilino || 'Nenhum'}</span></div>
                    <div class="detail-item"><span class="detail-label">Vigência</span><span class="detail-value">${imovel.vigencia || '-'}</span></div>
                    <div class="detail-item"><span class="detail-label">Área</span><span class="detail-value">${imovel.area || '-'} m²</span></div>
                    <div class="detail-item"><span class="detail-label">IPTU</span><span class="detail-value">R$ ${imovel.iptu || '0,00'}</span></div>
                    <div class="detail-item"><span class="detail-label">Caução</span><span class="detail-value">${imovel.caucao}</span></div>
                    <div class="detail-item"><span class="detail-label">Data Cadastro</span><span class="detail-value">${imovel.data}</span></div>
                    <div class="detail-item"><span class="detail-label">Matrícula</span><span class="detail-value">${imovel.matricula || '-'}</span></div>
                    <div class="detail-item"><span class="detail-label">ENEL/Sabesp</span><span class="detail-value">${imovel.enel || '-'}/${imovel.sabesp || '-'}</span></div>
                    <div class="detail-item" style="grid-column: span 2;"><span class="detail-label">Observações</span><span class="detail-value">${imovel.obs || 'Sem observações.'}</span></div>
                </div>
            `;
            document.getElementById('detalhes-content').innerHTML = content;
            document.getElementById('modal-detalhes').style.display = 'flex';
        }

        // API VIACEP
        async function buscarCEP() {
            const cep = document.getElementById('f-cep').value.replace(/\D/g, '');
            if(cep.length !== 8) {
                alert('CEP inválido');
                return;
            }
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if(data.erro) {
                    alert('CEP não encontrado');
                    return;
                }
                document.getElementById('f-endereco').value = data.logradouro;
                document.getElementById('f-bairro').value = data.bairro;
                document.getElementById('f-cidade').value = data.localidade;
                document.getElementById('f-estado').value = data.uf;
            } catch (e) {
                alert('Erro ao buscar CEP');
            }
        }

        // EXPORTAÇÃO CSV
        function exportarCSV() {
            if(imoveis.length === 0) return alert('Nenhum dado para exportar');
            
            const headers = Object.keys(imoveis[0]).join(';');
            const rows = imoveis.map(imovel => {
                return Object.values(imovel).map(val => `"${val}"`).join(';');
            }).join('
');
            
            const csvContent = "data:text/csv;charset=utf-8," + headers + "
" + rows;
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "imoveis_pro_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
